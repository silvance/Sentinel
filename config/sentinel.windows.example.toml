# Sentinel recorder configuration for Windows — EXAMPLE ONLY.
# Recommended layout (see docs/07 "Windows deployment"):
#   C:\Program Files\Sentinel\                 program (readable by the service account)
#   C:\ProgramData\Sentinel\config\            this file + camera.secret (DPAPI content; Administrators change)
#   C:\ProgramData\Sentinel\{spool,data,logs}  recordings, ledger, logs (service account only)
#   C:\ProgramData\Sentinel\status\            status.json + ledger snapshot (operators may READ)
# Install the service from a Command Prompt opened as administrator in C:\Program Files\Sentinel
# (the Sentinel window does the same: System > Service > "Install / repair service..."):
#   SentinelService.exe set-camera-credentials --config C:\ProgramData\Sentinel\config\sentinel.toml
#   SentinelService.exe install --config C:\ProgramData\Sentinel\config\sentinel.toml --dry-run
#   SentinelService.exe install --config C:\ProgramData\Sentinel\config\sentinel.toml
# From a source checkout (developers) use "python -m sentinel.winsvc" instead of "SentinelService.exe".
# No real addresses or credentials belong in this file.

[camera]
id = "CAM01"
name = "Camera 1"
# 192.0.2.0/24 is a documentation-only address range; the RTSP path is NOT verified (docs/02 A1).
url = "rtsp://192.0.2.10:554/REPLACE-WITH-VERIFIED-PATH"
transport = "tcp"
# Written by Sentinel.exe first-run setup or `SentinelService.exe set-camera-credentials`
# (Windows DPAPI, machine scope; the format is detected by content). One layout for both (integration).
credentials_file = 'C:\ProgramData\Sentinel\config\camera.secret'
include_audio = false

[recording]
segment_seconds = 3600
align_to_clock = true
display_timezone = "America/New_York"

[storage]
# Internal recording disk. Keep spool, data and logs in dedicated folders (the installer
# replaces their permissions).
spool_dir = 'C:\ProgramData\Sentinel\spool'
data_dir = 'C:\ProgramData\Sentinel\data'
log_dir = 'C:\ProgramData\Sentinel\logs'
# Operator-readable: the installer grants the local group "Sentinel Operators" read access here.
# It must be its own folder: never the same as, above or inside spool/data/logs (refused).
status_dir = 'C:\ProgramData\Sentinel\status'
warning_free_gb = 50
critical_free_gb = 5

[tools]
# Full paths are required for the service: it does not see a personal PATH. The built program
# keeps FFmpeg directly in its ffmpeg\ folder (no bin\); the same files are used when [tools]
# is left out. A source install points these at its own protected FFmpeg folder instead.
ffmpeg = 'C:\Program Files\Sentinel\ffmpeg\ffmpeg.exe'
ffprobe = 'C:\Program Files\Sentinel\ffmpeg\ffprobe.exe'

[service]
log_level = "INFO"
watchdog_timeout_s = 120           # recording loop silent this long => process restarts

# Optional: the organisation using this recorder. Shown in the window, on diagnostic reports and on
# review-drive summaries. Leave out (or empty) to name no organisation. One line, at most 100 characters.
# [site]
# organization = "Example Organisation"
