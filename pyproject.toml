[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-recorder"
version = "0.3.10"
description = "Standalone single-camera IP recorder and evidence export appliance"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = ["tzdata==2025.2; sys_platform == 'win32'"]   # stdlib otherwise; FFmpeg/FFprobe are system packages

[project.optional-dependencies]
dev = ["pytest==8.3.4"]
# Operator GUI only (the recorder never imports Qt). Essentials = QtCore/QtGui/QtWidgets/QtSvg, LGPL;
# 6.11.3 wheels are cp310-abi3 (Python 3.10-3.14), so the same pin serves 3.12 and 3.14.
gui = ["PySide6-Essentials==6.11.3", "shiboken6==6.11.3"]

[project.scripts]
sentinel-recorder = "sentinel.service:main"
sentinel-gui = "sentinel.gui.__main__:main"
# The simulated camera is a development tool (it listens on TCP) and is deliberately not
# installed as a command; run it with `python -m sentinel.sim.camera` from a source checkout.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
  "integration: requires FFmpeg/FFprobe on PATH; spawns real processes",
  "slow: takes more than ~20 seconds",
]
addopts = "-ra"
